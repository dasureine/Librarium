  <style>
    :root {
      --ink-0: #141c1a;
      --ink-1: #1a2422;
      --ink-2: #202c28;
      --ink-3: #2c3b36;
      --paper: #ede9df;
      --mist: #9bb0a5;
      --moss: #85a897;
      --card-bg: rgba(38, 50, 46, 0.56);
      --card-border: rgba(182, 198, 189, 0.18);
      --font-serif: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-display: "Pinyon Script", "Snell Roundhand", "Edwardian Script ITC", "Vivaldi", "French Script MT", "Gabriola", "Apple Chancery", cursive;
      --font-aux: "Cormorant Garamond", "Gabriola", "Palatino Linotype", "Source Han Serif SC", "Noto Serif SC", "Songti SC", Georgia, serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: var(--font-sans);
      color: var(--paper);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      background-color: var(--ink-0);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(1200px 820px at 78% 16%, var(--ink-3) 0%, transparent 56%),
        radial-gradient(920px 720px at 10% 88%, var(--ink-2) 0%, transparent 60%),
        linear-gradient(158deg, var(--ink-0) 0%, var(--ink-1) 46%, var(--ink-2) 100%);
    }

    /* 画布颗粒噪点 */
    .noise {
      position: fixed;
      inset: 0;
      z-index: 9997;
      pointer-events: none;
      opacity: 0.055;
      mix-blend-mode: soft-light;
    }

    /* 雾幕转场（纯 GPU 合成层：动画期间仅过渡 opacity 与 transform） */
    .curtain {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #1d2925 0%, #141c1a 78%);
      opacity: 1;
      visibility: visible;
      will-change: opacity, transform;
      transform: translateZ(0);
    }

    /* 竖线：静态宽柔光层（水平 + 垂直渐变模拟中心明亮、边缘羽化，不依赖 filter） */
    .curtain::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 16px;
      transform: translateX(-50%) translateZ(0) scaleY(1) scaleX(1);
      background:
        linear-gradient(to bottom, transparent 0%, rgba(235, 232, 224, 0.10) 20%, rgba(240, 237, 228, 0.55) 50%, rgba(235, 232, 224, 0.10) 80%, transparent 100%),
        linear-gradient(90deg, transparent 0%, rgba(235, 232, 224, 0.10) 30%, rgba(240, 237, 228, 0.28) 50%, rgba(235, 232, 224, 0.10) 70%, transparent 100%);
      opacity: 0.72;
      will-change: opacity, transform;
      pointer-events: none;
    }

    /* 外页 → 竖线：离开当前页（650ms 后跳转） */
    .curtain.covering {
      animation: curtainCover 580ms cubic-bezier(0.25, 0.1, 0.25, 1) 0ms both;
    }
    .curtain.covering::after {
      animation: lineCover 400ms cubic-bezier(0.22, 1, 0.36, 1) 180ms both;
    }

    /* 竖线 → 内页：进入目标页揭幕（pointer-events 放行，避免遮挡开场交互） */
    .curtain.revealing {
      pointer-events: none;
      animation: curtainReveal 850ms cubic-bezier(0.16, 1, 0.3, 1) 80ms both;
    }
    .curtain.revealing::after {
      animation: lineReveal 340ms cubic-bezier(0.22, 1, 0.36, 1) 0ms both;
    }

    /* 揭幕完成后的静默隐藏态 */
    .curtain.settled {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .curtain.settled::after {
      opacity: 0;
    }

    @keyframes curtainCover {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes lineCover {
      from { opacity: 0; transform: translateX(-50%) translateZ(0) scaleY(0.45) scaleX(1); }
      to { opacity: 0.72; transform: translateX(-50%) translateZ(0) scaleY(1) scaleX(1); }
    }
    @keyframes curtainReveal {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    @keyframes lineReveal {
      from { opacity: 0.72; transform: translateX(-50%) translateZ(0) scaleY(1) scaleX(1); }
      to { opacity: 0; transform: translateX(-50%) translateZ(0) scaleY(1.06) scaleX(2.4); }
    }

    /* 布局：单画布景深一体，无左右分栏 */
    .layout { position: relative; min-height: 100vh; }

    .art-board {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      animation: artIn 1.1s var(--ease) both;
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: clamp(130px, 20vh, 220px) clamp(24px, 5vw, 56px) 60px;
    }

    /* 艺术画板各层 */
    .art-far {
      position: absolute;
      inset: 0;
      opacity: 0.14;
      will-change: transform;
    }
    .art-light {
      position: absolute;
      top: -6%; bottom: -6%; left: 36%; width: 26%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(235,232,222,0.05) 42%, rgba(235,232,222,0.11) 50%, rgba(235,232,222,0.05) 58%, transparent);
      filter: blur(34px);
      will-change: transform;
      animation: breathe 7s ease-in-out infinite;
    }
    .art-lily {
      position: absolute;
      top: -4%;
      right: -3%;
      width: min(620px, 68vw);
      height: min(620px, 68vh);
      mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(70% 70% at 66% 26%, #000 38%, rgba(0,0,0,0.4) 64%, transparent 86%);
      mask-image: radial-gradient(70% 70% at 66% 26%, #000 38%, rgba(0,0,0,0.4) 64%, transparent 86%);
      will-change: transform;
    }
    .art-lily svg { width: 100%; height: 100%; }
    .art-caption {
      position: absolute;
      left: 28px;
      bottom: 24px;
      font-size: 11px;
      letter-spacing: 0.42em;
      color: var(--moss);
      opacity: 0.6;
    }

    /* 右侧内容 */
    .masthead { text-align: center; margin-bottom: clamp(40px, 5vw, 64px); }
    .brand {
      font-family: var(--font-display);
      font-size: clamp(72px, 10vw, 144px);
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.3;
      color: var(--paper);
      cursor: pointer;
    }
    .brand > span {
      display: inline-block;
      opacity: 0;
      transform: translateY(34px);
      animation: riseIn 0.95s var(--ease) 2.40s forwards;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: center;
      gap: 28px;
      margin-bottom: 44px;
      opacity: 0;
      transform: translateY(34px);
      animation: riseFade 0.9s var(--ease) 2.56s both;
    }
    .filter-group { position: relative; display: flex; flex-wrap: wrap; gap: 30px; }
    .filter-btn {
      appearance: none;
      background: transparent;
      color: var(--mist);
      border: none;
      padding: 4px 0;
      font-size: 14px;
      letter-spacing: 0.05em;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.3s var(--ease);
    }
    .filter-btn:hover { color: var(--paper); }
    .filter-btn.active { color: var(--paper); }
    .filter-underline {
      position: absolute;
      left: 0; bottom: -7px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--moss), transparent);
      transition: left 0.45s var(--ease), width 0.45s var(--ease);
      pointer-events: none;
    }
    .book-count { font-size: 12px; letter-spacing: 0.1em; color: var(--moss); opacity: 0.75; font-variant-numeric: tabular-nums; }

    /* 书目条目：磨砂玻璃藏书目录 */
    .book-grid { display: grid; grid-template-columns: 1fr; gap: 22px; }
    .book-card {
      position: relative;
      display: block;
      padding: 32px 38px;
      background: rgba(30, 42, 38, 0.42);
      backdrop-filter: blur(18px) saturate(115%);
      -webkit-backdrop-filter: blur(18px) saturate(115%);
      border: 1px solid rgba(235, 232, 224, 0.16);
      border-top-color: rgba(235, 232, 224, 0.26);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(10, 16, 14, 0.35), inset 0 1px 0 rgba(255,255,255,0.06);
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease), border-color 0.5s var(--ease), box-shadow 0.5s var(--ease);
      animation: cardIn 0.7s var(--ease) both;
    }
    .book-card:hover {
      transform: translateY(-4px);
      border-color: rgba(235, 232, 224, 0.34);
      box-shadow: 0 26px 54px rgba(10, 16, 14, 0.5), inset 0 0 0 1px rgba(133,168,151,0.28);
    }
    .book-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(300px circle at var(--mx, 50%) var(--my, 50%), rgba(133,168,151,0.16), transparent 65%);
      opacity: 0;
      transition: opacity 0.4s var(--ease);
      pointer-events: none;
      border-radius: 12px;
    }
    .book-card:hover::after { opacity: 1; }
    .book-grid:has(.book-card:hover) .book-card:not(:hover) { opacity: 0.45; }

    .card-layout { display: flex; gap: 36px; align-items: flex-start; }
    .card-index {
      width: 100px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 6px;
    }
    .card-num { font-family: var(--font-aux); font-size: 17px; color: var(--moss); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
    .card-date { font-family: var(--font-aux); font-size: 13px; color: var(--mist); opacity: 0.65; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
    .card-body { flex: 1; min-width: 0; }
    .card-title {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.32;
      color: var(--paper);
      margin-bottom: 6px;
      transition: transform 0.5s var(--ease), color 0.35s var(--ease);
    }
    .book-card:hover .card-title { transform: translateX(6px); }
    .card-subtitle { font-size: 14px; color: var(--mist); margin-bottom: 8px; }
    .card-author { font-family: var(--font-aux); font-size: 14px; color: var(--mist); opacity: 0.85; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
    .card-summary { font-size: 13.5px; color: rgba(155,176,165,0.8); line-height: 1.75; margin-bottom: 16px; }
    .card-tags { font-size: 12.5px; letter-spacing: 0.03em; color: var(--mist); opacity: 0.72; }
    .card-arrow {
      position: absolute;
      right: 28px; top: 50%;
      transform: translateY(-50%) translateX(-12px);
      font-size: 22px;
      color: var(--moss);
      opacity: 0;
      transition: opacity 0.45s var(--ease), transform 0.45s var(--ease);
    }
    .book-card:hover .card-arrow { opacity: 1; transform: translateY(-50%) translateX(0); }

    /* 跟随光标的微光晕 */
    .cursor-glow {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(560px circle at var(--gx, 50%) var(--gy, 40%), rgba(127,158,143,0.10), transparent 62%);
    }

    .status-box {
      padding: 24px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--mist);
      font-size: 13.5px;
      line-height: 1.7;
    }
    .status-box strong, .status-box code { color: var(--paper); }

    .site-foot {
      margin-top: 110px;
      text-align: center;
      font-family: var(--font-aux);
      font-size: 15px;
      letter-spacing: 0.38em;
      color: var(--moss);
      opacity: 0.5;
    }

    /* 鼠标光源：扫过百合花瓣的柔光 */
    .light-sweep {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      mix-blend-mode: soft-light;
      background: radial-gradient(360px circle at var(--lx, 42%) var(--ly, 40%), rgba(240,236,226,0.85), rgba(240,236,226,0.22) 46%, transparent 72%);
    }

    /* 呼吸感微光光点浮尘 */
    .dust {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      .art-board {
        position: relative;
        width: 100%;
        height: 46vh;
        align-self: auto;
        -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
        mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
      }
      .content { width: 100%; padding: 40px 22px 72px; }
    }

    @keyframes artIn {
      from { transform: scale(1.07); filter: blur(4px); }
      to { transform: scale(1); filter: blur(0); }
    }
    @keyframes riseIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes riseFade {
      from { opacity: 0; transform: translateY(34px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(34px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-1.2deg); }
      50% { transform: rotate(1.2deg); }
    }
    /* —— 入场翻书成花（单 SVG 引擎，3D-to-2D 实时透视投影） —— */
    .intro-stage {
      position: fixed;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      overflow: hidden;
    }
    .intro-stage svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .intro-stage.settled {
      z-index: 0;
    }

    /* —— 落定态：主体内容错峰浮上 —— */
    html.settled .brand > span,
    html.settled .toolbar,
    html.settled .book-card {
      animation: none;
      opacity: 1;
      transform: none;
    }
  </style>

  <script>
    (function () {
      /* 书架卡片与筛选条已迁移至 Atlases 视图（由 assets/home-views.js 渲染） */

      /* 雾幕转场（纯 GPU 合成层：动画期间仅过渡 opacity 与 transform） */
      var curtain = document.getElementById("curtain");

      function settleCurtain() {
        curtain.classList.remove("revealing", "covering");
        curtain.classList.add("settled");
      }

      /* 进入页：首帧静态绘制完成后，双层 rAF 平滑启动揭幕 */
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          curtain.classList.add("revealing");
          curtain.addEventListener("animationend", function onRevealEnd(e) {
            if (e.target === curtain && e.animationName === "curtainReveal") {
              curtain.removeEventListener("animationend", onRevealEnd);
              settleCurtain();
            }
          });
        });
      });

      document.addEventListener("click", function (e) {
        var a = e.target && e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var href = a.getAttribute("href");
        if (!href || href.charAt(0) === "#" || /^[a-z][a-z0-9+.-]*:/i.test(href) || a.target === "_blank") return;
        if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        curtain.classList.remove("settled", "revealing");
        curtain.classList.add("covering");
        setTimeout(function () { window.location.href = href; }, 650);
      });

      window.addEventListener("pageshow", function (e) {
        /* 后退 / 前进恢复时，若仍停留在雾幕，则直接落定 */
        if (e.persisted) {
          settleCurtain();
        }
      });

      /* 惯性视差 + 光标追光 */
      var artBoard = document.getElementById("artBoard");
      var glow = document.getElementById("cursorGlow");
      var lightSweep = document.getElementById("lightSweep");
      var layers = artBoard.querySelectorAll("[data-depth]");
      var targetX = 0, targetY = 0, curX = 0, curY = 0;
      var gx = 50, gy = 40, curGx = 50, curGy = 40;
      function lerp(a, b, t) { return a + (b - a) * t; }
      window.addEventListener("mousemove", function (e) {
        targetX = (e.clientX / window.innerWidth - 0.5) * 2;
        targetY = (e.clientY / window.innerHeight - 0.5) * 2;
        gx = e.clientX / window.innerWidth * 100;
        gy = e.clientY / window.innerHeight * 100;
      });
      (function tick() {
        curX = lerp(curX, targetX, 0.06);
        curY = lerp(curY, targetY, 0.06);
        curGx = lerp(curGx, gx, 0.06);
        curGy = lerp(curGy, gy, 0.06);
        layers.forEach(function (l) {
          var d = parseFloat(l.getAttribute("data-depth")) || 0;
          l.style.transform = "translate(" + (curX * d * -1) + "px," + (curY * d * -1) + "px)";
        });
        glow.style.setProperty("--gx", curGx + "%");
        glow.style.setProperty("--gy", curGy + "%");
        lightSweep.style.setProperty("--lx", curGx + "%");
        lightSweep.style.setProperty("--ly", curGy + "%");
        var lily = document.getElementById("artLily");
        if (lily) {
          var ldx = curGx - 86, ldy = curGy - 6;
          var ld = Math.sqrt(ldx * ldx + ldy * ldy);
          lily.style.filter = "brightness(" + (1 + Math.max(0, 1 - ld / 40) * 0.55).toFixed(3) + ")";
        }
        requestAnimationFrame(tick);
      })();
    })();
  </script>

  <script>
    /* 原有呼吸感微光光点浮尘已停用：不再创建漂浮圆点、也不再启动动画循环，
       避免占用 CPU。全屏雨丝改由 assets/home-atmosphere.js 渲染。 */
  </script>

  <script>
    (function () {
      var root = document.documentElement;
      var stage = document.getElementById("introStage");
      var svg = document.getElementById("introSvg");
      if (!stage || !svg) return;

      var NS = "http://www.w3.org/2000/svg";

      var W = 0, H = 0, CX = 0, CY = 0, SCALE = 1;
      function resize() {
        W = window.innerWidth; H = window.innerHeight;
        svg.setAttribute("width", W);
        svg.setAttribute("height", H);
        CX = W * 0.5;
        CY = H * (W < 640 ? 0.40 : 0.44);
        SCALE = Math.min(1, W / 920, H / 760);
        if (SCALE < 0.46) SCALE = 0.46;
        if (SCALE > 1.15) SCALE = 1.15;
      }

      var N = 18;
      var BOOK_H = 340;
      var LEAF_R = 250;
      var COVER_W = 292;
      var COVER_H = 368;
      var TH = 26;
      var F = 900;
      var WA = 0.16;
      var ARCH = 30;
      var SPREAD = 1.40;
      var COVER_ANGLE = 155 * Math.PI / 180;
      var SPINE_W = 9;

      var T = 3.4;
      var P1 = 1.15 / T;
      var P2 = 2.25 / T;
      var P3 = 3.0 / T;

      function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
      function smooth(x) { x = clamp01(x); return x * x * (3 - 2 * x); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function lerpAngle(a, b, t) {
        var d = (b - a) % (Math.PI * 2);
        if (d > Math.PI) d -= Math.PI * 2;
        if (d < -Math.PI) d += Math.PI * 2;
        return a + d * t;
      }

      var PC = 1, PS = 0;
      function proj(x, y, z, scale) {
        var yp = y * PC + z * PS;
        var zp = -y * PS + z * PC;
        var s = F / (F - zp);
        return [CX + x * s * scale, CY - yp * s * scale, zp];
      }

      var leaves = [];
      for (var i = 0; i < N; i++) {
        var right = (i % 2 === 0);
        var half = right ? Math.floor(i / 2) : Math.floor((i - 1) / 2);
        var fanOffset = (half / 8) * 2 - 1;
        var closed = right ? 0 : Math.PI;
        var bookAngle = closed + SPREAD * fanOffset;
        var flowerAngle = i * Math.PI * 2 / N;
        var k = Math.round((bookAngle - flowerAngle) / (Math.PI * 2));
        leaves.push({
          closed: closed,
          bookAngle: bookAngle,
          flowerTarget: flowerAngle + k * Math.PI * 2,
          stagger: Math.abs(fanOffset) * 0.16
        });
      }

      function el(tag, attrs) {
        var e = document.createElementNS(NS, tag);
        for (var key in attrs) e.setAttribute(key, attrs[key]);
        return e;
      }

      var gSpine = el("g", {});
      var spinePath = el("path", { fill: "none", stroke: "rgba(242,239,232,0.55)", "stroke-width": "0.9", "stroke-linecap": "round" });
      gSpine.appendChild(spinePath);

      var gFlower = el("g", {});
      var leafEls = [];
      for (i = 0; i < N; i++) {
        leafEls.push(el("path", { fill: "rgba(20,29,26,0.55)", stroke: "rgba(242,239,232,0.92)", "stroke-width": "1.05", "stroke-linejoin": "round" }));
      }
      var textEl = el("path", { fill: "none", stroke: "rgba(242,239,232,0.16)", "stroke-width": "0.6" });

      var gCenter = el("g", {});
      var guidePath = el("path", { fill: "none", stroke: "rgba(242,239,232,0.5)", "stroke-width": "0.8", "stroke-dasharray": "2 5", opacity: "0.22" });
      var stamenPath = el("path", { fill: "none", stroke: "rgba(242,239,232,0.6)", "stroke-width": "0.85", "stroke-linecap": "round" });
      gCenter.appendChild(guidePath);
      gCenter.appendChild(stamenPath);

      var gCovers = el("g", {});
      var coverFillR = el("path", { fill: "rgba(18,26,24,0.72)", stroke: "rgba(242,239,232,0.9)", "stroke-width": "1.1", "stroke-linejoin": "round" });
      var coverFillL = el("path", { fill: "rgba(18,26,24,0.72)", stroke: "rgba(242,239,232,0.9)", "stroke-width": "1.1", "stroke-linejoin": "round" });
      var coverLineR = el("path", { fill: "none", stroke: "rgba(242,239,232,0.55)", "stroke-width": "0.8", "stroke-linejoin": "round" });
      var coverLineL = el("path", { fill: "none", stroke: "rgba(242,239,232,0.55)", "stroke-width": "0.8", "stroke-linejoin": "round" });
      gCovers.appendChild(coverFillR);
      gCovers.appendChild(coverFillL);
      gCovers.appendChild(coverLineR);
      gCovers.appendChild(coverLineL);

      svg.appendChild(gSpine);
      svg.appendChild(gFlower);
      svg.appendChild(gCovers);

      function leafPath(leaf, th, p, scale) {
        var M = 26;
        var c = Math.cos(th), s = Math.sin(th);
        var e1 = [], e2 = [];
        var zmid = 0;
        for (var j = 0; j <= M; j++) {
          var u = j / M;
          var r = LEAF_R * u;
          var blade = Math.pow(Math.sin(Math.PI * u), 0.8);
          var wy = (BOOK_H / 2) * (1 - p);
          var wa = WA * p * blade;
          var lift = ARCH * Math.sin(Math.PI * u) * (1 - p) + 5 * Math.sin(Math.PI * u) * p;
          var a1 = th + wa, a2 = th - wa;
          var x1 = r * Math.cos(a1), z1 = r * Math.sin(a1), y1 = lift + wy;
          var x2 = r * Math.cos(a2), z2 = r * Math.sin(a2), y2 = lift - wy;
          var p1 = proj(x1, y1, z1, scale);
          var p2 = proj(x2, y2, z2, scale);
          e1.push(p1); e2.push(p2);
          if (j === Math.floor(M / 2)) zmid = (p1[2] + p2[2]) / 2;
        }
        var d = "M" + e1[0][0].toFixed(1) + "," + e1[0][1].toFixed(1);
        for (j = 1; j <= M; j++) d += "L" + e1[j][0].toFixed(1) + "," + e1[j][1].toFixed(1);
        for (j = M; j >= 0; j--) d += "L" + e2[j][0].toFixed(1) + "," + e2[j][1].toFixed(1);
        d += "Z";
        return { d: d, z: zmid };
      }

      function textPath(coverP, scale) {
        var seg = [];
        for (var i = 0; i < N; i++) {
          var leaf = leaves[i];
          var s = smooth(clamp01((coverP - leaf.stagger) / Math.max(0.0001, 1 - leaf.stagger)));
          var th = lerpAngle(leaf.closed, leaf.bookAngle, s);
          var ys = [-0.18, 0, 0.18];
          for (var q = 0; q < ys.length; q++) {
            var yh = ys[q] * BOOK_H;
            var u0 = 0.16, u1 = 0.78;
            var p0 = proj(LEAF_R * u0 * Math.cos(th), yh, LEAF_R * u0 * Math.sin(th), scale);
            var p1 = proj(LEAF_R * u1 * Math.cos(th), yh, LEAF_R * u1 * Math.sin(th), scale);
            seg.push("M" + p0[0].toFixed(1) + "," + p0[1].toFixed(1) + "L" + p1[0].toFixed(1) + "," + p1[1].toFixed(1));
          }
        }
        return seg.join("");
      }

      function coverPt(side, lx, ly, a, scale) {
        var wx = side * lx;
        var wz = TH / 2;
        var rx = wx * Math.cos(a) + wz * Math.sin(a);
        var rz = -wx * Math.sin(a) + wz * Math.cos(a);
        return proj(rx, ly, rz, scale);
      }

      function coverPanel(side, a, scale) {
        var p1 = coverPt(side, 0, -COVER_H / 2, a, scale);
        var p2 = coverPt(side, COVER_W, -COVER_H / 2, a, scale);
        var p3 = coverPt(side, COVER_W, COVER_H / 2, a, scale);
        var p4 = coverPt(side, 0, COVER_H / 2, a, scale);
        return "M" + p1[0].toFixed(1) + "," + p1[1].toFixed(1) +
          "L" + p2[0].toFixed(1) + "," + p2[1].toFixed(1) +
          "L" + p3[0].toFixed(1) + "," + p3[1].toFixed(1) +
          "L" + p4[0].toFixed(1) + "," + p4[1].toFixed(1) + "Z";
      }

      function coverLines(side, a, scale) {
        var inset = 15;
        var i1 = coverPt(side, inset, -COVER_H / 2 + inset, a, scale);
        var i2 = coverPt(side, COVER_W - inset, -COVER_H / 2 + inset, a, scale);
        var i3 = coverPt(side, COVER_W - inset, COVER_H / 2 - inset, a, scale);
        var i4 = coverPt(side, inset, COVER_H / 2 - inset, a, scale);
        var d = "M" + i1[0].toFixed(1) + "," + i1[1].toFixed(1) +
          "L" + i2[0].toFixed(1) + "," + i2[1].toFixed(1) +
          "L" + i3[0].toFixed(1) + "," + i3[1].toFixed(1) +
          "L" + i4[0].toFixed(1) + "," + i4[1].toFixed(1) + "Z";
        var corners = [
          [inset, -COVER_H / 2 + inset],
          [COVER_W - inset, -COVER_H / 2 + inset],
          [COVER_W - inset, COVER_H / 2 - inset],
          [inset, COVER_H / 2 - inset]
        ];
        var dd = 7;
        for (var k = 0; k < 4; k++) {
          var lx = corners[k][0], ly = corners[k][1];
          var q1 = coverPt(side, lx - dd, ly, a, scale);
          var q2 = coverPt(side, lx, ly - dd, a, scale);
          var q3 = coverPt(side, lx + dd, ly, a, scale);
          var q4 = coverPt(side, lx, ly + dd, a, scale);
          d += "M" + q1[0].toFixed(1) + "," + q1[1].toFixed(1) +
            "L" + q2[0].toFixed(1) + "," + q2[1].toFixed(1) +
            "L" + q3[0].toFixed(1) + "," + q3[1].toFixed(1) +
            "L" + q4[0].toFixed(1) + "," + q4[1].toFixed(1) + "Z";
        }
        return d;
      }

      function spineRender(scale) {
        var steps = 10;
        var y0 = -COVER_H / 2, y1 = COVER_H / 2;
        var L = [], R = [], M = [];
        for (var j = 0; j <= steps; j++) {
          var y = y0 + (y1 - y0) * (j / steps);
          var bulge = 6 * Math.sin(Math.PI * (j / steps));
          L.push(proj(-SPINE_W, y, TH / 2, scale));
          R.push(proj(SPINE_W, y, TH / 2, scale));
          M.push(proj(0, y, TH / 2 + bulge, scale));
        }
        var d = "";
        for (j = 0; j <= steps; j++) d += (j ? "L" : "M") + L[j][0].toFixed(1) + "," + L[j][1].toFixed(1);
        for (j = 0; j <= steps; j++) d += (j ? "L" : "M") + M[j][0].toFixed(1) + "," + M[j][1].toFixed(1);
        for (j = 0; j <= steps; j++) d += (j ? "L" : "M") + R[j][0].toFixed(1) + "," + R[j][1].toFixed(1);
        var ridges = 6;
        for (j = 0; j < ridges; j++) {
          var yy = y0 + (y1 - y0) * ((j + 0.5) / ridges);
          var pl = proj(-SPINE_W, yy, TH / 2, scale);
          var pr = proj(SPINE_W, yy, TH / 2, scale);
          d += "M" + pl[0].toFixed(1) + "," + pl[1].toFixed(1) + "L" + pr[0].toFixed(1) + "," + pr[1].toFixed(1);
        }
        spinePath.setAttribute("d", d);
      }

      function circlePath(cx, cy, r) {
        return "M" + (cx - r).toFixed(1) + "," + cy.toFixed(1) +
          "a" + r.toFixed(1) + "," + r.toFixed(1) + " 0 1 0 " + (2 * r).toFixed(1) + ",0" +
          "a" + r.toFixed(1) + "," + r.toFixed(1) + " 0 1 0 -" + (2 * r).toFixed(1) + ",0";
      }

      function centerRender(scale) {
        var dg = "";
        for (var k = 0; k < 2; k++) dg += circlePath(CX, CY, (118 + k * 46) * scale);
        guidePath.setAttribute("d", dg);
        var ds = "";
        var stamens = 8;
        for (var i = 0; i < stamens; i++) {
          var ang = (i / stamens) * Math.PI * 2 + Math.PI / stamens;
          var r0 = 15 * scale, r1 = 54 * scale;
          var x0 = CX + Math.cos(ang) * r0, y0 = CY + Math.sin(ang) * r0;
          var x1 = CX + Math.cos(ang) * r1, y1 = CY + Math.sin(ang) * r1;
          ds += "M" + x0.toFixed(1) + "," + y0.toFixed(1) + "L" + x1.toFixed(1) + "," + y1.toFixed(1);
          var dd = 5 * scale;
          ds += "M" + (x1 - dd).toFixed(1) + "," + y1.toFixed(1) +
            "L" + x1.toFixed(1) + "," + (y1 - dd).toFixed(1) +
            "L" + (x1 + dd).toFixed(1) + "," + y1.toFixed(1) +
            "L" + x1.toFixed(1) + "," + (y1 + dd).toFixed(1) + "Z";
        }
        ds += circlePath(CX, CY, 7 * scale);
        stamenPath.setAttribute("d", ds);
      }

      function render(t) {
        var coverP = smooth(clamp01(t / P1));
        var pitchP = smooth(clamp01((t - P1) / (P2 - P1)));
        var morph = pitchP;
        var p = pitchP;
        var settleP = smooth(clamp01((t - P2) / (P3 - P2)));

        var alpha = COVER_ANGLE * coverP;
        var pitch = (88 * Math.PI / 180) * pitchP;
        var scale = SCALE * (1 + 0.12 * settleP);
        PC = Math.cos(pitch); PS = Math.sin(pitch);

        gFlower.setAttribute("opacity", (1 - 0.84 * settleP).toFixed(3));
        gCovers.setAttribute("opacity", (1 - settleP).toFixed(3));
        gSpine.setAttribute("opacity", ((1 - pitchP) * (1 - settleP)).toFixed(3));
        gCenter.setAttribute("opacity", pitchP.toFixed(3));

        var order = [];
        for (var i = 0; i < N; i++) {
          var leaf = leaves[i];
          var s = smooth(clamp01((coverP - leaf.stagger) / Math.max(0.0001, 1 - leaf.stagger)));
          var fanTh = lerpAngle(leaf.closed, leaf.bookAngle, s);
          var th = lerpAngle(fanTh, leaf.flowerTarget, morph);
          var res = leafPath(leaf, th, p, scale);
          leafEls[i].setAttribute("d", res.d);
          leafEls[i].setAttribute("fill-opacity", ((1 - p) * 0.55).toFixed(3));
          order.push({ el: leafEls[i], z: res.z });
        }
        order.sort(function (a, b) { return a.z - b.z; });
        for (i = 0; i < order.length; i++) gFlower.appendChild(order[i].el);

        textEl.setAttribute("d", textPath(coverP, scale));
        textEl.setAttribute("opacity", ((1 - p) * 0.5).toFixed(3));
        gFlower.appendChild(textEl);
        gFlower.appendChild(gCenter);

        coverFillR.setAttribute("d", coverPanel(1, alpha, scale));
        coverFillL.setAttribute("d", coverPanel(-1, -alpha, scale));
        coverLineR.setAttribute("d", coverLines(1, alpha, scale));
        coverLineL.setAttribute("d", coverLines(-1, -alpha, scale));

        spineRender(scale);
        centerRender(scale);
      }

      var startTime = null, rafId = null, running = false;

      function frame(now) {
        if (startTime === null) startTime = now;
        var t = (now - startTime) / 1000 / T;
        if (t >= 1) t = 1;
        render(t);
        if (t < 1) {
          rafId = requestAnimationFrame(frame);
        } else {
          running = false;
          rafId = null;
          stage.classList.add("settled");
          root.classList.add("settled");
        }
      }

      function showSettled() {
        if (rafId) cancelAnimationFrame(rafId);
        running = false;
        stage.classList.add("settled");
        root.classList.add("settled");
        render(1);
      }

      function restartContent() {
        var list = [document.querySelector(".brand > span"), document.querySelector(".toolbar")];
        list.forEach(function (el) { if (el) { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; } });
        document.querySelectorAll(".book-card").forEach(function (el, idx) {
          el.style.animation = "none"; void el.offsetWidth;
          el.style.animationDelay = (2620 + idx * 90) + "ms";
          el.style.animation = "";
        });
      }

      function start() {
        if (rafId) cancelAnimationFrame(rafId);
        running = true;
        startTime = null;
        stage.classList.remove("settled");
        root.classList.remove("settled");
        restartContent();
        rafId = requestAnimationFrame(frame);
      }

      function settledEntry() {
        try { if (new URLSearchParams(location.search).get("settled") === "1") return true; } catch (e) {}
        try { if (document.referrer && document.referrer.indexOf("/maps/") !== -1) return true; } catch (e) {}
        return false;
      }

      document.addEventListener("click", function () {
        if (running) showSettled();
      });

      var brand = document.querySelector(".brand");
      if (brand) {
        brand.addEventListener("click", function (e) {
          e.stopPropagation();
          if (running) showSettled(); else start();
        });
      }

      resize();
      window.addEventListener("resize", function () { resize(); if (!running) render(1); });

      if (settledEntry()) showSettled(); else start();
    })();
  </script>
