<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>儒教与道教 · 知识地图</title>
  <style>
    :root {
      --bg-page: #F7F8F7;
      --bg-card: #FFFFFF;
      --bg-subtle: #F2F4F2;
      --bg-green-soft: #EBF2EE;
      --text-main: #1A1A1A;
      --text-secondary: #595959;
      --text-muted: #7A7F7A;
      --border-light: #D8DDD8;
      --border-strong: #BFC5BF;
      --green-main: #1F4E3D;
      --green-dark: #2D5A43;
      --green-mid: #4A7C62;
      --font-serif: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部栏 */
    .topbar {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .back-link {
      font-size: 13px;
      color: var(--green-main);
      text-decoration: none;
      border: 1px solid var(--border-light);
      padding: 5px 12px;
      background-color: var(--bg-page);
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .back-link:hover {
      border-color: var(--green-main);
      background-color: var(--bg-green-soft);
    }

    .title-block h1 {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
    }

    .title-block p {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .perspective-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ctrl-btn {
      appearance: none;
      background-color: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
      padding: 6px 13px;
      font-size: 12.5px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover:not(:disabled) {
      border-color: var(--green-main);
      color: var(--green-main);
    }

    .ctrl-btn.active {
      background-color: var(--green-main);
      border-color: var(--green-main);
      color: #FFFFFF;
    }

    .ctrl-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* 主体可拖动双栏 */
    .workspace {
      flex: 1;
      display: flex;
      min-height: calc(100vh - 68px);
      overflow: hidden;
    }

    .workspace.resizing {
      cursor: col-resize;
      user-select: none;
    }

    /* 左侧图谱区 */
    .canvas-pane {
      flex: 1;
      min-width: 340px;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-page);
    }

    /* 中间可拖动分隔条 */
    .resizer {
      width: 6px;
      flex-shrink: 0;
      background-color: var(--border-light);
      cursor: col-resize;
      position: relative;
      transition: background-color 0.15s ease;
    }

    .resizer::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 28px;
      background-color: var(--text-muted);
      opacity: 0.45;
    }

    .resizer:hover,
    .resizer.dragging {
      background-color: var(--green-mid);
    }

    .resizer:hover::after,
    .resizer.dragging::after {
      background-color: #FFFFFF;
      opacity: 0.9;
    }

    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .legend-line {
      display: inline-block;
      width: 24px;
      height: 0;
      border-top-width: 2px;
      border-top-style: solid;
    }

    .legend-line.both {
      border-top-color: #595959;
    }

    .legend-line.primary {
      border-top-color: #1F4E3D;
    }

    .legend-line.secondary {
      border-top-color: #4A7C62;
      border-top-style: dashed;
    }

    .svg-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: auto;
    }

    svg#mapSvg {
      width: 100%;
      max-width: 1000px;
      height: auto;
      display: block;
      user-select: none;
    }

    /* SVG 内部样式 */
    .edge-path {
      fill: none;
      transition: opacity 0.2s ease, stroke 0.2s ease, stroke-width 0.2s ease;
      cursor: pointer;
    }

    .edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 16;
      cursor: pointer;
    }

    .edge-label-group {
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .edge-label-bg {
      fill: #FFFFFF;
      stroke: #D8DDD8;
      stroke-width: 1;
    }

    .edge-label-group.highlighted .edge-label-bg {
      fill: #EBF2EE;
      stroke: #1F4E3D;
    }

    .edge-label-text {
      font-size: 11px;
      fill: #595959;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .edge-label-group.highlighted .edge-label-text {
      fill: #1F4E3D;
      font-weight: 600;
    }

    .node-group {
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .node-rect {
      fill: #FFFFFF;
      stroke: #BFC5BF;
      stroke-width: 1.25;
      transition: fill 0.15s ease, stroke 0.15s ease, stroke-width 0.15s ease;
    }

    .node-group:hover .node-rect {
      fill: #EBF2EE;
      stroke: #1F4E3D;
    }

    .node-group.highlighted .node-rect {
      stroke: #1F4E3D;
      stroke-width: 1.8;
    }

    .node-group.selected .node-rect {
      fill: #EBF2EE;
      stroke: #1F4E3D;
      stroke-width: 2.2;
    }

    .node-accent-bar {
      fill: #D8DDD8;
      transition: fill 0.15s ease;
    }

    .node-group.highlighted .node-accent-bar,
    .node-group.selected .node-accent-bar,
    .node-group:hover .node-accent-bar {
      fill: #1F4E3D;
    }

    .node-cat {
      font-size: 10.5px;
      fill: #4A7C62;
      letter-spacing: 0.04em;
      text-anchor: middle;
    }

    .node-title {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 600;
      fill: #1A1A1A;
      text-anchor: middle;
    }

    .node-brief {
      font-size: 11px;
      fill: #595959;
      text-anchor: middle;
    }

    .dimmed {
      opacity: 0.2;
    }

    /* 底部步进条 */
    .stepper-bar {
      background-color: var(--bg-card);
      border-top: 1px solid var(--border-light);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .step-info {
      flex: 1;
      min-width: 240px;
    }

    .step-tag {
      font-size: 11.5px;
      color: var(--green-main);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .step-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .step-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 右侧详情面板 */
    .detail-pane {
      width: 400px;
      min-width: 260px;
      max-width: 72vw;
      flex-shrink: 0;
      background-color: var(--bg-card);
      padding: 24px;
      overflow-y: auto;
      max-height: calc(100vh - 68px);
    }

    .detail-kicker {
      font-size: 11.5px;
      color: var(--green-main);
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .detail-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-light);
    }

    .detail-summary {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .detail-section {
      margin-bottom: 22px;
    }

    .detail-section h3 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 10px;
      padding-left: 8px;
      border-left: 2px solid var(--green-main);
    }

    .point-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .point-list li {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 8px 10px;
      background-color: var(--bg-page);
      border: 1px solid var(--bg-subtle);
      line-height: 1.65;
    }

    .point-list li strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .perspective-note {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 10px 12px;
      background-color: var(--bg-green-soft);
      border: 1px solid var(--border-light);
      margin-bottom: 8px;
    }

    .perspective-note strong {
      display: block;
      font-size: 12px;
      color: var(--green-main);
      margin-bottom: 3px;
    }

    .rel-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rel-item {
      text-align: left;
      width: 100%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      padding: 9px 11px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .rel-item:hover {
      border-color: var(--green-main);
      background-color: var(--bg-green-soft);
    }

    .rel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--green-main);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .rel-body {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .node-index-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      background-color: var(--bg-page);
      border: 1px solid var(--border-light);
      margin-bottom: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .node-index-btn:hover {
      border-color: var(--green-main);
      background-color: var(--bg-green-soft);
    }

    .node-index-btn span:first-child {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
    }

    .node-index-btn span:last-child {
      font-size: 11.5px;
      color: var(--green-mid);
    }

    @media (max-width: 900px) {
      .workspace {
        flex-direction: column;
        min-height: auto;
        overflow: visible;
      }
      .canvas-pane {
        min-width: 0;
        border-bottom: 1px solid var(--border-light);
      }
      .resizer {
        display: none;
      }
      .detail-pane {
        width: 100% !important;
        max-width: 100%;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="back-link" href="../index.html">← 返回总目录</a>
      <div class="title-block">
        <h1 id="pageTitle"></h1>
        <p id="pageSubtitle"></p>
      </div>
    </div>
    <div id="perspectiveGroup" class="perspective-group"></div>
  </header>

  <div id="workspace" class="workspace">
    <section class="canvas-pane">
      <div class="legend-bar">
        <div id="legendItems" class="legend-items"></div>
        <span>点击节点或连线查看详情，再次点击取消选中</span>
      </div>
      <div class="svg-wrapper">
        <svg id="mapSvg" viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="stepper-bar">
        <div class="step-info">
          <div id="stepTag" class="step-tag"></div>
          <div id="stepDesc" class="step-desc"></div>
        </div>
        <div class="step-actions">
          <button id="prevStepBtn" class="ctrl-btn" type="button">上一步</button>
          <button id="nextStepBtn" class="ctrl-btn" type="button">下一步</button>
          <button id="resetBtn" class="ctrl-btn" type="button">重置全景</button>
        </div>
      </div>
    </section>

    <div id="resizer" class="resizer" title="左右拖动调节分屏比例"></div>

    <aside id="detailPane" class="detail-pane"></aside>
  </div>

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

    function createSvgEl(tag, attrs = {}) {

    function clipToNodeBox(cx, cy, tx, ty, pad) {
      const dx = tx - cx;
      const dy = ty - cy;
      if (dx === 0 && dy === 0) return { x: cx, y: cy };
      const hw = NODE_W / 2 + pad;
      const hh = NODE_H / 2 + pad;
      const scaleX = dx !== 0 ? hw / Math.abs(dx) : Infinity;
      const scaleY = dy !== 0 ? hh / Math.abs(dy) : Infinity;
      const t = Math.min(scaleX, scaleY);
      return { x: cx + dx * t, y: cy + dy * t };
    }

    function computeEdgeGeometry(edge) {

      const t = nodeMap.get(edge.target);
      const dx = t.x - s.x;
      const dy = t.y - s.y;
      const len = Math.hypot(dx, dy) || 1;
      const curve = edge.curve || 0;
      const mx = (s.x + t.x) / 2;
      const my = (s.y + t.y) / 2;
      const nx = -dy / len;
      const ny = dx / len;
      const cx = mx + nx * curve;
      const cy = my + ny * curve;

      const start = clipToNodeBox(s.x, s.y, curve === 0 ? t.x : cx, curve === 0 ? t.y : cy, 2);
      const end = clipToNodeBox(t.x, t.y, curve === 0 ? s.x : cx, curve === 0 ? s.y : cy, 7);

        ? `M ${start.x.toFixed(1)} ${start.y.toFixed(1)} L ${end.x.toFixed(1)} ${end.y.toFixed(1)}`
        : `M ${start.x.toFixed(1)} ${start.y.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${end.x.toFixed(1)} ${end.y.toFixed(1)}`;

      const u = typeof edge.labelT === "number" ? edge.labelT : 0.5;
      let lx, ly;
      if (curve === 0) {
        lx = start.x + (end.x - start.x) * u;
        ly = start.y + (end.y - start.y) * u;
      } else {
        const inv = 1 - u;
        lx = inv * inv * start.x + 2 * inv * u * cx + u * u * end.x;
        ly = inv * inv * start.y + 2 * inv * u * cy + u * u * end.y;
      }

      return { d, lx, ly };
    }

    function getActiveSets() {
      const activeNodes = new Set();
      const activeEdges = new Set();

      if (state.stepIndex >= 0) {
        const step = MAP_DATA.steps[state.stepIndex];
        step.activeNodes.forEach(id => activeNodes.add(id));
        step.activeEdges.forEach(id => activeEdges.add(id));
        return { activeNodes, activeEdges, filtering: true };
      }

      if (state.selectedNodeId) {
        activeNodes.add(state.selectedNodeId);
        MAP_DATA.edges.forEach(e => {
          if (e.source === state.selectedNodeId || e.target === state.selectedNodeId) {
            if (isEdgeInPerspective(e)) {
              activeEdges.add(e.id);
              activeNodes.add(e.source);
              activeNodes.add(e.target);
            }
          }
        });
        return { activeNodes, activeEdges, filtering: true };
      }

      if (state.selectedEdgeId) {
        const edge = edgeMap.get(state.selectedEdgeId);
        if (edge) {
          activeEdges.add(edge.id);
          activeNodes.add(edge.source);
          activeNodes.add(edge.target);
        }
        return { activeNodes, activeEdges, filtering: true };
      }

      if (state.perspective !== "all") {
        MAP_DATA.edges.forEach(e => {
          if (isEdgeInPerspective(e)) {
            activeEdges.add(e.id);
            activeNodes.add(e.source);
            activeNodes.add(e.target);
          }
        });
        return { activeNodes, activeEdges, filtering: true };
      }

      MAP_DATA.nodes.forEach(n => activeNodes.add(n.id));
      MAP_DATA.edges.forEach(e => activeEdges.add(e.id));
      return { activeNodes, activeEdges, filtering: false };
    }

    function isEdgeInPerspective(edge) {
      if (state.perspective === "all") return true;
      return edge.perspective === "both" || edge.perspective === state.perspective;
    }

    function getEdgeStyle(edge, isHighlighted, isDimmed) {
      let stroke = "#595959";
      let dash = "";
      let marker = "url(#arrow-grey)";

      if (edge.perspective === "weber") {
        stroke = "#1F4E3D";
        marker = "url(#arrow-green)";
      } else if (edge.perspective === "althusser") {
        stroke = "#4A7C62";
        dash = "6 4";
        marker = "url(#arrow-midgreen)";
      }

      if (isDimmed) {
        stroke = "#BFC5BF";
        marker = "url(#arrow-muted)";
      } else if (isHighlighted && (state.stepIndex >= 0 || state.selectedNodeId || state.selectedEdgeId)) {
        stroke = "#1F4E3D";
        marker = "url(#arrow-green)";
      }

      const width = isHighlighted && (state.stepIndex >= 0 || state.selectedNodeId || state.selectedEdgeId) ? 2.2 : 1.5;
      return { stroke, dash, marker, width };
    }

    function renderHeaderAndLegend() {
      document.title = MAP_DATA.meta.title;
      document.getElementById("pageTitle").textContent = MAP_DATA.meta.title;
      document.getElementById("pageSubtitle").textContent = MAP_DATA.meta.subtitle;

      perspectiveGroupEl.innerHTML = "";
      MAP_DATA.perspectives.forEach(p => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ctrl-btn" + (state.perspective === p.id && state.stepIndex === -1 ? " active" : "");
        btn.textContent = p.label;
        btn.addEventListener("click", () => {
          state.perspective = p.id;
          state.stepIndex = -1;
          state.selectedNodeId = null;
          state.selectedEdgeId = null;
          renderAll();
        });
        perspectiveGroupEl.appendChild(btn);
      });

      legendItemsEl.innerHTML = MAP_DATA.perspectives
        .map(p => `
          <span class="legend-item">
            <span class="legend-line ${p.lineClass}"></span>
            <span>${escapeHtml(p.legendLabel)}</span>
          </span>
        `)
        .join("");
    }

    function renderSvg() {
      svgEl.innerHTML = "";

      const defs = createSvgEl("defs");
      const markers = [
        { id: "arrow-grey", color: "#595959" },
        { id: "arrow-green", color: "#1F4E3D" },
        { id: "arrow-midgreen", color: "#4A7C62" },
        { id: "arrow-muted", color: "#BFC5BF" }
      ];

      markers.forEach(m => {
        const marker = createSvgEl("marker", {
          id: m.id,
          viewBox: "0 0 10 10",
          refX: "8.5",
          refY: "5",
          markerWidth: "6",
          markerHeight: "6",
          orient: "auto-start-reverse"
        });
        marker.appendChild(createSvgEl("path", {
          d: "M 0 1.2 L 9 5 L 0 8.8 z",
          fill: m.color
        }));
        defs.appendChild(marker);
      });
      svgEl.appendChild(defs);

      const { activeNodes, activeEdges, filtering } = getActiveSets();

      const edgeLayer = createSvgEl("g");
      const labelLayer = createSvgEl("g");
      const nodeLayer = createSvgEl("g");

      MAP_DATA.edges.forEach(edge => {
        const geom = computeEdgeGeometry(edge);
        const isActive = activeEdges.has(edge.id);
        const isDimmed = filtering && !isActive;
        const style = getEdgeStyle(edge, isActive, isDimmed);

        const gEdge = createSvgEl("g", { class: isDimmed ? "dimmed" : "" });

        const path = createSvgEl("path", {
          d: geom.d,
          class: "edge-path",
          stroke: style.stroke,
          "stroke-width": style.width,
          "marker-end": style.marker
        });
        if (style.dash) path.setAttribute("stroke-dasharray", style.dash);

        const hit = createSvgEl("path", { d: geom.d, class: "edge-hit" });

        /* 点击连线高亮，再次点击同一条连线取消选中恢复原状 */
        const onToggleEdge = () => {
          if (state.selectedEdgeId === edge.id) {
            state.selectedEdgeId = null;
          } else {
            state.selectedEdgeId = edge.id;
            state.selectedNodeId = null;
            state.stepIndex = -1;
          }
          renderAll();
        };

        hit.addEventListener("click", onToggleEdge);
        path.addEventListener("click", onToggleEdge);

        gEdge.appendChild(path);
        gEdge.appendChild(hit);
        edgeLayer.appendChild(gEdge);

        const labelText = edge.label;
        const boxW = Math.max(84, labelText.length * 11.5 + 16);
        const boxH = 22;

        const gLabel = createSvgEl("g", {
          class: "edge-label-group"
            + (isDimmed ? " dimmed" : "")
            + ((state.selectedEdgeId === edge.id || (filtering && isActive)) ? " highlighted" : "")
        });
        gLabel.addEventListener("click", onToggleEdge);

        gLabel.appendChild(createSvgEl("rect", {
          x: (geom.lx - boxW / 2).toFixed(1),
          y: (geom.ly - boxH / 2).toFixed(1),
          width: boxW,
          height: boxH,
          rx: 2,
          class: "edge-label-bg"
        }));

        const txt = createSvgEl("text", {
          x: geom.lx.toFixed(1),
          y: geom.ly.toFixed(1),
          class: "edge-label-text"
        });
        txt.textContent = labelText;
        gLabel.appendChild(txt);
        labelLayer.appendChild(gLabel);
      });

      MAP_DATA.nodes.forEach(node => {
        const isActive = activeNodes.has(node.id);
        const isDimmed = filtering && !isActive;
        const isSelected = state.selectedNodeId === node.id;

        const gNode = createSvgEl("g", {
          class: "node-group"
            + (isDimmed ? " dimmed" : "")
            + (filtering && isActive ? " highlighted" : "")
            + (isSelected ? " selected" : "")
        });

        /* 点击节点高亮，再次点击同一个节点取消选中恢复原状 */
        gNode.addEventListener("click", () => {
          if (state.selectedNodeId === node.id) {
            state.selectedNodeId = null;
          } else {
            state.selectedNodeId = node.id;
            state.selectedEdgeId = null;
            state.stepIndex = -1;
          }
          renderAll();
        });

        const x0 = node.x - NODE_W / 2;
        const y0 = node.y - NODE_H / 2;

        gNode.appendChild(createSvgEl("rect", {
          x: x0,
          y: y0,
          width: NODE_W,
          height: NODE_H,
          rx: 2,
          class: "node-rect"
        }));

        gNode.appendChild(createSvgEl("rect", {
          x: x0,
          y: y0,
          width: NODE_W,
          height: 3.5,
          class: "node-accent-bar"
        }));

        /* 方块内三行文字统一以节点水平中心 node.x 对齐居中 */
        const catText = createSvgEl("text", {
          x: node.x,
          y: y0 + 24,
          class: "node-cat"
        });
        catText.textContent = node.category;
        gNode.appendChild(catText);

        const titleText = createSvgEl("text", {
          x: node.x,
          y: y0 + 49,
          class: "node-title"
        });
        titleText.textContent = node.title;
        gNode.appendChild(titleText);

        const briefText = createSvgEl("text", {
          x: node.x,
          y: y0 + 73,
          class: "node-brief"
        });
        briefText.textContent = node.brief;
        gNode.appendChild(briefText);

        nodeLayer.appendChild(gNode);
      });

      svgEl.appendChild(edgeLayer);
      svgEl.appendChild(nodeLayer);
      svgEl.appendChild(labelLayer);
    }

    function renderStepper() {
      if (state.stepIndex >= 0) {
        const step = MAP_DATA.steps[state.stepIndex];
        stepTagEl.textContent = step.title;
        stepDescEl.textContent = step.description;
      } else {
        const pObj = MAP_DATA.perspectives.find(p => p.id === state.perspective);
        stepTagEl.textContent = `当前模式：${pObj ? pObj.label : "全景"}`;
        stepDescEl.textContent = "点击“下一步”可按因果顺序分步浏览整本书的核心逻辑链条。";
      }

      prevStepBtn.disabled = state.stepIndex <= 0;
      nextStepBtn.disabled = state.stepIndex >= MAP_DATA.steps.length - 1;
    }

    function renderDetailPane() {
      if (state.selectedNodeId) {
        const node = nodeMap.get(state.selectedNodeId);
        const incoming = MAP_DATA.edges.filter(e => e.target === node.id);
        const outgoing = MAP_DATA.edges.filter(e => e.source === node.id);

        const subPointsHtml = node.subPoints
          .map(sp => `<li><strong>${escapeHtml(sp.label)}：</strong>${escapeHtml(sp.text)}</li>`)
          .join("");

        const pNotesHtml = (node.perspectivesNote || [])
          .map(pn => `<div class="perspective-note"><strong>${escapeHtml(pn.label)}</strong>${escapeHtml(pn.text)}</div>`)
          .join("");

        const renderRelButtons = (edges, dir) => {
          if (edges.length === 0) return `<p style="font-size:12.5px;color:#7A7F7A;">无直接连线</p>`;
          return edges.map(e => {
            const peer = nodeMap.get(dir === "in" ? e.source : e.target);
            const arrowText = dir === "in"
              ? `${escapeHtml(peer.title)} → 本模块`
              : `本模块 → ${escapeHtml(peer.title)}`;
            return `
              <button class="rel-item" type="button" data-jump-node="${peer.id}">
                <div class="rel-head">
                  <span>${arrowText}</span>
                  <span>${escapeHtml(e.label)}</span>
                </div>
                <div class="rel-body">${escapeHtml(e.detail)}</div>
              </button>
            `;
          }).join("");
        };

        detailPaneEl.innerHTML = `
          <div class="detail-kicker">${escapeHtml(node.category)}</div>
          <h2 class="detail-title">${escapeHtml(node.title)}</h2>
          <p class="detail-summary">${escapeHtml(node.summary)}</p>

          <div class="detail-section">
            <h3>核心要点</h3>
            <ul class="point-list">${subPointsHtml}</ul>
          </div>

          ${pNotesHtml ? `<div class="detail-section"><h3>理论定位</h3>${pNotesHtml}</div>` : ""}

          <div class="detail-section">
            <h3>上游输入机制</h3>
            <div class="rel-list">${renderRelButtons(incoming, "in")}</div>
          </div>

          <div class="detail-section">
            <h3>下游输出机制</h3>
            <div class="rel-list">${renderRelButtons(outgoing, "out")}</div>
          </div>
        `;

        detailPaneEl.querySelectorAll("[data-jump-node]").forEach(btn => {
          btn.addEventListener("click", () => {
            state.selectedNodeId = btn.getAttribute("data-jump-node");
            state.selectedEdgeId = null;
            renderAll();
            detailPaneEl.scrollTop = 0;
          });
        });
        return;
      }

      if (state.selectedEdgeId) {
        const edge = edgeMap.get(state.selectedEdgeId);
        const s = nodeMap.get(edge.source);
        const t = nodeMap.get(edge.target);
        const pObj = MAP_DATA.perspectives.find(p => p.id === edge.perspective) || MAP_DATA.perspectives[0];

        detailPaneEl.innerHTML = `
          <div class="detail-kicker">因果与作用机制 · ${escapeHtml(pObj.legendLabel)}</div>
          <h2 class="detail-title">${escapeHtml(edge.label)}</h2>
          <p class="detail-summary">${escapeHtml(edge.detail)}</p>

          <div class="detail-section">
            <h3>关联模块</h3>
            <button class="node-index-btn" type="button" data-jump-node="${s.id}">
              <span>起点：${escapeHtml(s.title)}</span>
              <span>查看详情 →</span>
            </button>
            <button class="node-index-btn" type="button" data-jump-node="${t.id}">
              <span>终点：${escapeHtml(t.title)}</span>
              <span>查看详情 →</span>
            </button>
          </div>
        `;

        detailPaneEl.querySelectorAll("[data-jump-node]").forEach(btn => {
          btn.addEventListener("click", () => {
            state.selectedNodeId = btn.getAttribute("data-jump-node");
            state.selectedEdgeId = null;
            renderAll();
          });
        });
        return;
      }

      const indexButtonsHtml = MAP_DATA.nodes
        .map(n => `
          <button class="node-index-btn" type="button" data-jump-node="${n.id}">
            <span>${escapeHtml(n.title)}</span>
            <span>${escapeHtml(n.category)}</span>
          </button>
        `)
        .join("");

      detailPaneEl.innerHTML = `
        <div class="detail-kicker">图谱导览</div>
        <h2 class="detail-title">模块与机制索引</h2>
        <p class="detail-summary">${escapeHtml(MAP_DATA.meta.overview)}</p>
        <div class="detail-section">
          <h3>选择模块查看笔记细节</h3>
          ${indexButtonsHtml}
        </div>
      `;

      detailPaneEl.querySelectorAll("[data-jump-node]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedNodeId = btn.getAttribute("data-jump-node");
          state.selectedEdgeId = null;
          renderAll();
        });
      });
    }

    function renderAll() {
      renderHeaderAndLegend();
      renderSvg();
      renderStepper();
      renderDetailPane();
    }

    prevStepBtn.addEventListener("click", () => {
      if (state.stepIndex > 0) {
        state.stepIndex -= 1;
        state.selectedNodeId = null;
        state.selectedEdgeId = null;
        renderAll();
      }
    });

    nextStepBtn.addEventListener("click", () => {
      if (state.stepIndex < MAP_DATA.steps.length - 1) {
        state.stepIndex += 1;
        state.selectedNodeId = null;
        state.selectedEdgeId = null;
        renderAll();
      }
    });

    resetBtn.addEventListener("click", () => {
      state.perspective = "all";
      state.stepIndex = -1;
      state.selectedNodeId = null;
      state.selectedEdgeId = null;
      renderAll();
    });

    renderAll();
  </script>
</body>
</html>
